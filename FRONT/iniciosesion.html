<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storm Game - Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue&family=Google+Sans:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="iniciosesion.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <img class="Title" src="fotos/Storm-Game.png" alt="">
        <div class="container-fluid">
            <a class="navbar-brand" href="inicio.html">
                <img src="fotos/Logo.png" alt="Logo" class="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"> Menu </a>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            <li><a class="dropdown-item" href="perfil.html">Perfil</a></li>
                            <li><a class="dropdown-item" href="config.html">Configuración</a></li>
                            <li><a class="dropdown-item" href="stats.html">Estadísticas</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="ayuda.html">Ayuda</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Buscar">
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div class="card-google">
            <div class="header-section">
                <div class="google-logo-text">
                    <span style="color: #552583">Storm</span>
                </div>
                <h1 class="form-title">Iniciar Sesion</h1>
                <p class="text-secondary">Ingresa tus datos</p>
            </div>

            <form>
                <div class="input-group-custom">
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input-group-custom">
                    <input type="password" placeholder="Contraseña" required>
                </div>
                <div class="d-flex justify-content-center my-3">
                    <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
                </div>
                <div style="overflow: hidden; margin-top: 10px;">
                    <button type="submit" data-url="inicio.html" onclick="validarYRedirigir(event, this)" class="btn-google">Siguiente</button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="iniciosesion.js"></script>
</body>
</html>
