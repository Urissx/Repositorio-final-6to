<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="inicio.css">
    <title>Storm Game</title>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <img class="Title" src="fotos/Storm-Game.png" alt="">
    <div class="container-fluid">
        <a class="navbar-brand logo-link" href="inicio.html">
            <img src="fotos/Logo.png" alt="Logo" class="logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <button class="btn btn-outline-success" data-url="iniciosesion.html" onclick="irAlJuego(this)">Iniciar Sesion</button>
        <button class="btn btn-outline-success" data-url="registro.html" onclick="irAlJuego(this)">Registrate</button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"> Menu </a>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            <li><a class="dropdown-item" href="perfil.html">Perfil</a></li>
                            <li><a class="dropdown-item" href="config.html">Configuración</a></li>
                            <li><a class="dropdown-item" href="stats.html">Estadísticas</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="ayuda.html">Ayuda</a></li>
                        </ul>
                    </li>
                </ul>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>
    </div>
</nav>
<div class="container-fluid d-flex justify-content-end mt-3">
    <button class="game btn-crear-torneo" data-url="creartorneo1.html" onclick="irAlJuego(this)">
        <span class="texto-torneo">Crear Torneo</span>
    </button>
    <button class="game btn-unirse-torneo" data-url="unirse.html" onclick="irAlJuego(this)">
        <span class="unirse-torneo">Unirse a un Torneo</span>
    </button>
</div>

<div class="carousel">
    <button class="arrow left" onclick="moveCarousel(-1, 'track1')">❮</button>
    <div class="viewport">
        <div class="track" id="track1">
            <button class="game" data-url="juego1.html" onclick="irAlJuego(this)"><img src="fotos/OIP.webp" alt=""></button>
            <button class="game" data-url="juego2.html" onclick="irAlJuego(this)"><img src="fotos/OIP (1).webp" alt=""></button>
            <button class="game" data-url="juego3.html" onclick="irAlJuego(this)"><img src="fotos/OIP (2).webp" alt=""></button>
            <button class="game" data-url="juego4.html" onclick="irAlJuego(this)"><img src="fotos/OIP (3).webp" alt=""></button>
            <button class="game" data-url="juego5.html" onclick="irAlJuego(this)"><img src="fotos/OIP (4).webp" alt=""></button>
            <button class="game" data-url="juego6.html" onclick="irAlJuego(this)"><img src="fotos/OIP (5).webp" alt=""></button>
            <button class="game" data-url="juego7.html" onclick="irAlJuego(this)"><img src="fotos/OIP (6).webp" alt=""></button>
            <button class="game" data-url="juego8.html" onclick="irAlJuego(this)"><img src="fotos/OIP (7).webp" alt=""></button>
        </div>
    </div>
    <button class="arrow right" onclick="moveCarousel(1, 'track1')">❯</button>
</div>

<div class="carousel" style="margin-top: 80px;">
    <button class="arrow left" onclick="moveCarousel(-1, 'track2')">❮</button>
    <div class="viewport">
        <div class="track" id="track2">
            <button class="game" data-url="aventura1.html" onclick="irAlJuego(this)"><img src="fotos/OIP.webp" alt=""></button>
            <button class="game" data-url="aventura2.html" onclick="irAlJuego(this)"><img src="fotos/OIP (1).webp" alt=""></button>
            <button class="game" data-url="aventura3.html" onclick="irAlJuego(this)"><img src="fotos/OIP (2).webp" alt=""></button>
            <button class="game" data-url="aventura4.html" onclick="irAlJuego(this)"><img src="fotos/OIP (3).webp" alt=""></button>
            <button class="game" data-url="aventura5.html" onclick="irAlJuego(this)"><img src="fotos/OIP (4).webp" alt=""></button>
            <button class="game" data-url="aventura6.html" onclick="irAlJuego(this)"><img src="fotos/OIP (5).webp" alt=""></button>
            <button class="game" data-url="aventura7.html" onclick="irAlJuego(this)"><img src="fotos/OIP (6).webp" alt=""></button>
            <button class="game" data-url="aventura8.html" onclick="irAlJuego(this)"><img src="fotos/OIP (7).webp" alt=""></button>
        </div>
    </div>
    <button class="arrow right" onclick="moveCarousel(1, 'track2')">❯</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="inicio.js"></script>
</body>
</html>
