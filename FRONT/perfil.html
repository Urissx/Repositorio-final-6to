            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">

<body>
    <div class="profile-container">
        <header class="profile-header">
            <div class="avatar-section">
                <img src="https://via.placeholder.com/150" alt="Avatar" class="avatar">
                <div class="user-info">

            <div class="level-section">
                <div class="level-badge">Nivel <span>14</span></div>

            </div>

        <main class="profile-content">
            <div class="artwork-showcase">
                <img src="https://via.placeholder.com/600x800" alt="Artwork Principal">
            </div>
            <aside class="sidebar">
                <div class="status">Actualmente en línea</div>
                <div class="stats-list">
                    <p>Insignias: 9</p>
                    <p>Juegos: 87</p>
                    <p>Capturas: 7</p>
