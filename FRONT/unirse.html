<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="inicio.css">
    <link rel="stylesheet" href="unirse.css">
    <title>Storm Game</title>
</head>
<header>
    <nav class="navbar navbar-expand-lg">
    <img class="Title" src="Storm-Game.png" alt="">
    <div class="container-fluid">
        <a class="navbar-brand logo-link" href="inicio.html">
            <img src="fotos/Logo.png " alt="Logo" class="logo" style="">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false"> = </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="perfil.html">perfil</a></li>
                        <li><a class="dropdown-item" href="config.html">configuracion</a></li>
                        <li><a class="dropdown-item" href="stats.html">estadisticas</a></li>
                        <li><a class="dropdown-item" href="ayuda.html">ayuda</a></li>
                    </ul>
                </li>
            </ul>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>
    </div>
</nav>
</header>
<body>

     <main class="main-container">
        <div class="card-google">
            <div class="header-section">
                <div class="google-logo-text">
                    <span style="color: #552583">Storm</span>
                </div>
                <h1 class="form-title">Unirse Torneo</h1>
                <p class="text-secondary">Ingresa los datos del torneo</p>
                <button class="btn btn-outline-light btn-sm ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#filterCollapse" aria-expanded="false" aria-controls="filterCollapse">
                    <i class="bi bi-filter"></i>
                </button>
            </div>

            <div class="collapse mt-3" id="filterCollapse">
                <div class="filter-options p-3 border rounded">
                    <h6>Filtros</h6>
                    <div class="mb-2">
                        <label for="filterDate" class="form-label">Fecha:</label>
                        <input type="date" id="filterDate" class="form-control form-control-sm">
                    </div>
                    <div class="mb-2">
                        <label for="filterGame" class="form-label">Juego:</label>
                        <select id="filterGame" class="form-control form-control-sm">
                            <option value="">Todos</option>
                            <option value="juego1">Juego 1</option>
                            <option value="juego2">Juego 2</option>
                            <!-- Agregar más opciones según los juegos disponibles -->
                        </select>
                    </div>
                </div>
            </div>

            <form>
                <div class="input-group-custom">
                    <input type="text" placeholder="Nombre del Juego" required>
                </div>
                
                <div style="overflow: hidden; margin-top: 10px;">
                    <button type="submit" class="btn-google">Siguiente</button>
                </div>
            </form>
        </div>
    </main>


 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <script src="inicio.js"></script>
</body>
