<!DOCTYPE html>
<html>
<heada>
<title>Crear Torneo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-5">

<h2>Crear Torneo</h2>

<form method="POST">

<input class="form-control mt-2" name="name" placeholder="Nombre">
<input class="form-control mt-2" name="game" placeholder="Juego">
<input class="form-control mt-2" name="format" placeholder="Formato">
<input class="form-control mt-2" name="rules" placeholder="Reglas">
<input class="form-control mt-2" name="prize" placeholder="Premio">
<input class="form-control mt-2" name="date" type="date">
<input class="form-control mt-2" name="max_players" placeholder="Cantidad jugadores">

<button class="btn btn-success mt-3">Crear</button>

</form>

</div>
</body>
</html>
